# Prometheus Operator ServiceMonitor for scraping the gateway's /metrics.
#
# Sets job="fastify-gateway" (matched by the alert rules) and authenticates
# with METRICS_TOKEN via a bearer token. Create the referenced secret with the
# same value as the gateway's METRICS_TOKEN:
#
#   kubectl create secret generic gateway-metrics \
#     --from-literal=token="$METRICS_TOKEN"
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fastify-gateway
  labels:
    app: fastify-gateway
    release: kube-prometheus-stack # match your Prometheus serviceMonitorSelector
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: fastify-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      authorization:
        type: Bearer
        credentials:
          name: gateway-metrics
          key: token
