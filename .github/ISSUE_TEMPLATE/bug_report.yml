name: Bug report
description: Something is not working as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For suspected security vulnerabilities, do NOT open an issue — see SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal steps, configuration (redact secrets), and requests that reproduce the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. curl ...
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: node -v
    validations:
      required: true
  - type: input
    id: gateway-version
    attributes:
      label: Gateway version or commit
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Logs are auto-formatted as code. Redact anything sensitive.
      render: shell
