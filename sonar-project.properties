# SonarQube / SonarCloud scanner configuration.
#
# Set these to your project's values (SonarCloud also needs sonar.organization,
# and the analysis needs a SONAR_TOKEN — see .github/workflows/sonarqube.yml).
sonar.projectKey=fastify-gateway
sonar.projectName=fastify-gateway

# Uncomment for SonarCloud:
# sonar.organization=your-org

# Source and test layout.
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts
sonar.sourceEncoding=UTF-8

# Coverage produced by `npm run test:cov` (vitest lcov reporter).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude build output, deps, generated helpers, and type-only declarations
# from analysis; server.ts is the untestable process entry point.
sonar.exclusions=dist/**,coverage/**,node_modules/**,scripts/**,**/*.d.ts
sonar.coverage.exclusions=test/**,scripts/**,src/server.ts,src/types/**
