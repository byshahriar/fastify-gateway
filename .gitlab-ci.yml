# GitLab CI/CD — mirrors the GitHub Actions workflows.

stages:
  - test
  - build
  - analysis

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

.node:
  image: node:${NODE_VERSION}-alpine
  cache:
    key: "npm-${NODE_VERSION}"
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

test:
  extends: .node
  stage: test
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22", "24"]
  script:
    - npm run format:check
    - npm run lint:check
    - npm run typecheck
    - npm run test:cov
    - npm run test:e2e
  coverage: '/All files\s+\|\s+([0-9.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t "fastify-gateway:$CI_COMMIT_SHORT_SHA" .

release-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"

# Disabled for now: manual-only, and needs SONAR_TOKEN / SONAR_HOST_URL set as
# CI/CD variables. Remove `when: manual` to run it automatically.
sonarqube:
  stage: analysis
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  rules:
    - when: manual
      allow_failure: true
  script:
    - sonar-scanner
